<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ventas de Café - Ejercicio 1 (HDB-)</title>
    <!-- Librería Chart.js y plugin para Treemap -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-treemap@2.3.0/dist/chartjs-chart-treemap.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f3f2f1;
            padding: 15px;
            color: #333;
        }
        /* Cuadrícula 2x2 idéntica a tu lienzo de Power BI */
        .lienzo-pbi {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 460px 460px;
            gap: 15px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .tarjeta-visual {
            background-color: #ffffff;
            border-radius: 4px;
            padding: 15px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Fondo grisáceo como el de tus visuales izquierdos en Power BI */
        .fondo-gris {
            background-color: #e6e6e6;
        }
        .titulo-azul {
            text-align: center;
            color: #0078d4;
            font-size: 1rem;
            font-weight: 600;
        }
        .titulo-negro {
            text-align: center;
            color: #000000;
            font-size: 1rem;
            font-weight: 700;
        }
        .subtitulo {
            font-size: 0.78rem;
            color: #605e5c;
            margin-bottom: 10px;
        }
        .contenedor-grafico {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 0;
        }
        @media (max-width: 1024px) {
            .lienzo-pbi {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(4, 450px);
            }
        }
    </style>
</head>
<body>

    <div class="lienzo-pbi">
        <!-- 1. ARRIBA IZQUIERDA: Barras Horizontales Rojas -->
        <div class="tarjeta-visual fondo-gris">
            <div class="titulo-azul">Recuento de coffee_name</div>
            <div class="subtitulo">por card</div>
            <div class="contenedor-grafico">
                <canvas id="chartBarrasRojas"></canvas>
            </div>
        </div>

        <!-- 2. ARRIBA DERECHA: Columnas + Área Sombrada por Bebida -->
        <div class="tarjeta-visual">
            <div class="titulo-negro">Recuento de date</div>
            <div class="subtitulo">por coffee_name</div>
            <div class="contenedor-grafico">
                <canvas id="chartColumnasArea"></canvas>
            </div>
        </div>

        <!-- 3. ABAJO IZQUIERDA: Treemap (Mapa de árbol por tarjeta) -->
        <div class="tarjeta-visual fondo-gris">
            <div class="titulo-azul">Recuento de coffee_name</div>
            <div class="subtitulo">por card</div>
            <div class="contenedor-grafico">
                <canvas id="chartTreemap"></canvas>
            </div>
        </div>

        <!-- 4. ABAJO DERECHA: Gráfico de Pastel (Pie Chart) -->
        <div class="tarjeta-visual">
            <div class="titulo-negro">Recuento de date</div>
            <div class="subtitulo">por coffee_name</div>
            <div class="contenedor-grafico">
                <canvas id="chartPastel"></canvas>
            </div>
        </div>
    </div>
